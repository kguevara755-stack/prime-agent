# prime-agent-runtime backs the `llm_council` console script but is intentionally
# not declared as a dependency: it ships with Prime Agent, is installed in the
# kernel venv before skills, and is not published on PyPI.
[project]
name = "prime-agent-skill-llm-council"
version = "0.1.0"
description = "Multi-model deliberation skill for Prime Agent (LLM Council over OpenRouter)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
llm_council = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_council"]
